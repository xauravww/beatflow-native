org.gradle.daemon=true
org.gradle.parallel=true
org.gradle.configureondemand=true
org.gradle.caching=true
org.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=1g -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
android.enableJetifier=true
# New Architecture is enabled by default in React Native 0.82+.
# Explicitly set the legacy flag so third-party libraries (e.g. @react-native-community/blur)
# that check `rootProject.hasProperty("newArchEnabled")` build with the New Architecture.
newArchEnabled=true
# Enabled to speed up subsequent builds
org.gradle.configuration-cache=true
